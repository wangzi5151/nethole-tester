name: CI

on:
  push:
    branches: [main, master]
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: build & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: "1.23"
          cache: true
      - name: gofmt
        run: |
          fmt=$(gofmt -s -l . | grep -v '^vendor/' || true)
          if [ -n "$fmt" ]; then echo "not gofmt'd:"; echo "$fmt"; exit 1; fi
      - name: vet
        run: go vet ./...
      - name: test (short, offline)
        run: go test -short ./...
      - name: build
        run: CGO_ENABLED=0 go build -trimpath -o /tmp/nethole ./cmd/nethole
      - name: version
        run: /tmp/nethole version
